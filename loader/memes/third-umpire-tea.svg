<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10203a"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd56a"/>
      <stop offset="1" stop-color="#f5c518"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#sky)"/>
  <rect x="10" y="10" width="620" height="460" rx="22" fill="none" stroke="rgba(245,197,24,0.28)" stroke-width="2"/>

  <text x="320" y="50" text-anchor="middle" fill="#f5c518" font-family="Teko, Impact, sans-serif" font-size="26">THIRD UMPIRE AT THE TEA STALL</text>
  <!-- empty chair -->
  <rect x="80" y="200" width="140" height="18" rx="4" fill="#8a5a2a"/>
  <rect x="96" y="218" width="16" height="90" fill="#6e4520"/>
  <rect x="188" y="218" width="16" height="90" fill="#6e4520"/>
  <rect x="90" y="140" width="120" height="70" rx="8" fill="#3b2a18" stroke="#f5c518"/>
  <text x="150" y="180" text-anchor="middle" fill="#9aa6c3" font-family="DM Sans, sans-serif" font-size="14">RESERVED</text>
  <text x="150" y="122" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="14">3rd umpire</text>
  <!-- stall -->
  <rect x="340" y="160" width="220" height="150" rx="8" fill="#7a2a12"/>
  <rect x="330" y="140" width="240" height="28" rx="4" fill="#f5c518"/>
  <text x="450" y="160" text-anchor="middle" fill="#10203a" font-family="Teko, sans-serif" font-size="22">CHAI  •  SUTTA-FREE ZONE</text>
  <rect x="370" y="190" width="50" height="70" fill="#f4f7ff"/>
  <rect x="430" y="200" width="40" height="60" fill="#f0c7a0"/>
  <rect x="480" y="210" width="46" height="50" fill="#d8d8d8"/>
  <!-- steam cups -->
  <ellipse cx="450" cy="320" rx="30" ry="10" fill="#f5c518"/>
  <path d="M440 250 q8 -20 16 0 q6 -14 12 2" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>
  <!-- small person with cap, generic -->
  <circle cx="400" cy="250" r="18" fill="#f0c7a0"/>
  <rect x="382" y="232" width="36" height="10" fill="#c41212"/>
  <text x="320" y="430" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="17" font-weight="700">“Soft signal is… cutting the samosa.”</text>

</svg>
