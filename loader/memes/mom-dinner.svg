<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10203a"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd56a"/>
      <stop offset="1" stop-color="#f5c518"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#sky)"/>
  <rect x="10" y="10" width="620" height="460" rx="22" fill="none" stroke="rgba(245,197,24,0.28)" stroke-width="2"/>

  <text x="320" y="48" text-anchor="middle" fill="#f5c518" font-family="Teko, Impact, sans-serif" font-size="28">DINNER VS LAST OVER</text>
  <!-- mom bubble -->
  <rect x="40" y="80" width="250" height="130" rx="20" fill="#1b2540" stroke="#f5c518" stroke-width="2"/>
  <path d="M90 210 l16 28 l10 -28" fill="#1b2540" stroke="#f5c518"/>
  <text x="165" y="130" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="22" font-weight="700">Mom:</text>
  <text x="165" y="168" text-anchor="middle" fill="#ffd56a" font-family="DM Sans, sans-serif" font-size="20">“Dinner is ready!”</text>
  <!-- thali -->
  <ellipse cx="165" cy="280" rx="70" ry="28" fill="#d8d8d8" stroke="#b0b0b0"/>
  <circle cx="145" cy="276" r="12" fill="#e86a17"/>
  <circle cx="175" cy="272" r="14" fill="#f5c518"/>
  <circle cx="165" cy="290" r="10" fill="#3ee0a0"/>
  <!-- me bubble -->
  <rect x="350" y="80" width="250" height="130" rx="20" fill="#141c30" stroke="#3ee0a0" stroke-width="2"/>
  <path d="M540 210 l-16 28 l-10 -28" fill="#141c30" stroke="#3ee0a0"/>
  <text x="475" y="130" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="22" font-weight="700">Me:</text>
  <text x="475" y="168" text-anchor="middle" fill="#3ee0a0" font-family="DM Sans, sans-serif" font-size="18">“Last over of the auction.”</text>
  <!-- paddle -->
  <rect x="430" y="240" width="90" height="64" rx="12" fill="#f5c518"/>
  <text x="475" y="280" text-anchor="middle" fill="#10203a" font-family="Teko, sans-serif" font-size="36">+5</text>
  <rect x="466" y="304" width="18" height="50" rx="4" fill="#8a5a2a"/>
  <text x="320" y="430" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="18" font-weight="700">The thali can wait. The purse cannot.</text>

</svg>
