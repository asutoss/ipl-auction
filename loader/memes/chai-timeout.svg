<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10203a"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd56a"/>
      <stop offset="1" stop-color="#f5c518"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#sky)"/>
  <rect x="10" y="10" width="620" height="460" rx="22" fill="none" stroke="rgba(245,197,24,0.28)" stroke-width="2"/>

  <text x="320" y="52" text-anchor="middle" fill="#f5c518" font-family="Teko, Impact, sans-serif" font-size="28" letter-spacing="1">STRATEGIC TIMEOUT = CHAI</text>
  <!-- kettle in pads -->
  <ellipse cx="230" cy="320" rx="90" ry="22" fill="rgba(0,0,0,0.25)"/>
  <path d="M170 230 h90 a40 40 0 0 1 0 80 h-90 z" fill="#d9dee8" stroke="#f5c518" stroke-width="3"/>
  <path d="M260 250 h36 a20 20 0 0 1 0 40 h-10" fill="none" stroke="#f5c518" stroke-width="8" stroke-linecap="round"/>
  <rect x="196" y="200" width="40" height="30" rx="6" fill="#c41212"/>
  <path d="M200 200 q16 -28 36 0" fill="none" stroke="#9aa6c3" stroke-width="4"/>
  <path d="M210 168 q8 -24 20 0 q6 -16 14 2" fill="#fff" opacity="0.7"/>
  <!-- pads -->
  <rect x="150" y="300" width="44" height="70" rx="10" fill="#f4f7ff" stroke="#c9d2e8"/>
  <rect x="266" y="300" width="44" height="70" rx="10" fill="#f4f7ff" stroke="#c9d2e8"/>
  <!-- mug with helmet grill -->
  <rect x="400" y="210" width="100" height="90" rx="16" fill="#f5c518"/>
  <path d="M500 230 h24 a18 18 0 0 1 0 50 h-24" fill="none" stroke="#f5c518" stroke-width="10"/>
  <path d="M418 230 h64 M418 248 h64 M418 266 h64" stroke="#10203a" stroke-width="3"/>
  <ellipse cx="450" cy="210" rx="50" ry="12" fill="#7a4a22"/>
  <text x="320" y="430" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="18" font-weight="700">“Five minutes, sir. Kettle is batting.”</text>

</svg>
