  </defs>
  <rect width="640" height="480" rx="28" fill="url(#sky)"/>
  <rect x="10" y="10" width="620" height="460" rx="22" fill="none" stroke="rgba(245,197,24,0.28)" stroke-width="2"/>

  <text x="320" y="50" text-anchor="middle" fill="#f5c518" font-family="Teko, Impact, sans-serif" font-size="30">NO BALL! REPLAY THE SPIN-UP</text>
