<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10203a"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd56a"/>
      <stop offset="1" stop-color="#f5c518"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#sky)"/>
  <rect x="10" y="10" width="620" height="460" rx="22" fill="none" stroke="rgba(245,197,24,0.28)" stroke-width="2"/>

  <text x="320" y="50" text-anchor="middle" fill="#f5c518" font-family="Teko, Impact, sans-serif" font-size="30">PURSE LEFT: 2 POINTS</text>
  <rect x="120" y="90" width="400" height="90" rx="18" fill="#141c30" stroke="#f5c518" stroke-width="3"/>
  <text x="320" y="150" text-anchor="middle" fill="#ffd56a" font-family="Teko, sans-serif" font-size="56">₹ 2</text>
  <!-- shopping list -->
  <g font-family="DM Sans, sans-serif" font-size="20" fill="#f4f7ff">
    <text x="160" y="240">☐  Still need a wicketkeeper</text>
    <text x="160" y="278">☐  Two more bowlers</text>
    <text x="160" y="316">☐  A miracle at base price</text>
    <text x="160" y="354">☑  Confidence (expired)</text>
  </g>
  <text x="320" y="430" text-anchor="middle" fill="#ffd56a" font-family="DM Sans, sans-serif" font-size="18" font-weight="700">“Maybe they accept hugs?”</text>

</svg>
