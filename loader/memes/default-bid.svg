<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10203a"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd56a"/>
      <stop offset="1" stop-color="#f5c518"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#sky)"/>
  <rect x="10" y="10" width="620" height="460" rx="22" fill="none" stroke="rgba(245,197,24,0.28)" stroke-width="2"/>

  <text x="320" y="50" text-anchor="middle" fill="#f5c518" font-family="Teko, Impact, sans-serif" font-size="26">LOOKED AWAY FOR ONE SECOND</text>
  <!-- phone -->
  <rect x="70" y="90" width="150" height="260" rx="22" fill="#1a1a1a" stroke="#f5c518" stroke-width="4"/>
  <rect x="84" y="116" width="122" height="200" rx="8" fill="#0d1424"/>
  <text x="145" y="170" text-anchor="middle" fill="#9aa6c3" font-family="DM Sans, sans-serif" font-size="12">SOLD</text>
  <circle cx="145" cy="210" r="28" fill="#2a3348" stroke="#f5c518"/>
  <text x="145" y="216" text-anchor="middle" fill="#f5c518" font-family="Teko, sans-serif" font-size="22">?</text>
  <text x="145" y="270" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="12">to YOU</text>
  <text x="145" y="292" text-anchor="middle" fill="#3ee0a0" font-family="DM Sans, sans-serif" font-size="14" font-weight="700">2 pts</text>
  <!-- shocked fan -->
  <circle cx="430" cy="200" r="50" fill="#f0c7a0"/>
  <circle cx="412" cy="190" r="7" fill="#1a1a1a"/>
  <circle cx="448" cy="190" r="7" fill="#1a1a1a"/>
  <ellipse cx="412" cy="190" rx="14" ry="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="448" cy="190" rx="14" ry="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M414 230 q16 16 32 0" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M390 226 q-16 8 -8 22" fill="none" stroke="#f0c7a0" stroke-width="8" stroke-linecap="round"/>
  <rect x="392" y="252" width="76" height="90" rx="12" fill="#1a5c2a"/>
  <text x="320" y="430" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="17" font-weight="700">Default bid said “yes” so you didn’t have to.</text>

</svg>
