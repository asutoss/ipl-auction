<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPL Auction Night</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Teko:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">●</span>
          <div>
            <h1>IPL Auction Night</h1>
          </div>
        </div>
        <div id="top-meta" class="top-meta" hidden></div>
      </header>
      <main id="main"></main>
      <div id="toast" class="toast" hidden></div>
    </div>
    <div id="pause-modal" class="pause-modal" hidden>
      <div class="pause-card">
        <h2>Game paused</h2>
        <p id="pause-msg" class="lede">Game paused.</p>
        <button class="btn" id="resume" type="button">Resume</button>
      </div>
    </div>
    <div id="power-confirm" class="power-confirm" hidden>
      <div class="power-confirm-card" role="dialog" aria-modal="true" aria-labelledby="power-confirm-name" aria-describedby="power-confirm-funny power-confirm-desc">
        <div class="power-confirm-face" id="power-confirm-face"></div>
        <h2 id="power-confirm-name"></h2>
        <p id="power-confirm-funny" class="power-confirm-funny"></p>
        <p id="power-confirm-desc" class="power-confirm-rule"></p>
        <div class="actions">
          <button class="btn" id="power-confirm-use" type="button">Use it</button>
          <button class="btn secondary" id="power-confirm-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <div id="power-modal" class="power-modal" hidden>
      <div class="power-card" id="power-card">
        <div class="power-face" id="power-face"></div>
        <h2 id="power-name"></h2>
        <p id="power-team" class="lede"></p>
        <p id="power-desc" class="lede"></p>
      </div>
    </div>
    <div id="wait-modal" class="wait-modal" hidden>
      <div class="wait-card" id="wait-card">
        <p class="kicker" id="wait-kicker">Power</p>
        <h2 id="wait-title">Waiting</h2>
        <p id="wait-prompt" class="lede"></p>
        <div id="wait-body"></div>
        <p class="wait-timer" id="wait-timer"></p>
        <div id="quick-chat-bar" class="quick-chat-bar" hidden></div>
      </div>
    </div>
    <div id="samay-preview" class="samay-preview" hidden>
      <p class="kicker">Chess Blundermaster</p>
      <h3>Next up</h3>
      <ol id="samay-list"></ol>
    </div>
    <div id="sold-modal" class="sold-modal" hidden>
      <div class="sold-card" id="sold-card">
        <div class="sold-claps" aria-hidden="true">
          <span>👏</span><span>👏</span><span>👏</span><span>👏</span><span>👏</span>
        </div>
        <p class="kicker" id="sold-kicker">Sold</p>
        <div class="sold-logo" id="sold-logo"></div>
        <h2 id="sold-player"></h2>
        <p id="sold-line" class="lede"></p>
        <button class="btn" id="sold-continue" type="button">Continue</button>
        <p class="sold-countdown" id="sold-countdown"></p>
        <div class="sold-progress" aria-hidden="true"><i id="sold-progress-bar"></i></div>
      </div>
    </div>
    <div id="player-intro" class="sold-modal player-intro" hidden>
      <div class="sold-card player-intro-card" id="player-intro-card">
        <p class="kicker" id="player-intro-kicker">On the block</p>
        <h2 id="player-intro-name"></h2>
        <div class="player-intro-meta" id="player-intro-meta"></div>
        <div class="player-intro-stats" id="player-intro-stats"></div>
        <p class="lede player-intro-bid" id="player-intro-bid"></p>
        <p class="sold-countdown" id="player-intro-countdown"></p>
        <div class="sold-progress" aria-hidden="true"><i id="player-intro-progress-bar"></i></div>
      </div>
    </div>
    <div id="last-team-fill" class="sold-modal last-team-fill" hidden>
      <div class="sold-card last-team-fill-card" id="last-team-fill-card">
        <p class="kicker" id="last-team-fill-kicker">Squad filled</p>
        <div class="sold-logo" id="last-team-fill-logo"></div>
        <h2 id="last-team-fill-team"></h2>
        <p id="last-team-fill-line" class="lede">These players join the squad at the starting bid.</p>
        <ul class="last-team-fill-list" id="last-team-fill-list"></ul>
        <button class="btn" id="last-team-fill-continue" type="button">Continue</button>
        <p class="sold-countdown" id="last-team-fill-countdown"></p>
        <div class="sold-progress" aria-hidden="true"><i id="last-team-fill-progress-bar"></i></div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/characters.js"></script>
    <script src="/identities.js"></script>
    <script src="/state.js"></script>
    <script src="/emotes.js"></script>
    <script src="/quick-chat.js"></script>
    <script src="/ring.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
